name: Autonomous News & Market Intelligence Engine

on:
  schedule:
    # Hourly during Indian Trading Sessions (Mon-Fri)
    # 03:30 UTC to 11:30 UTC = 9:00 AM to 5:00 PM IST
    # Covers: Pre-market (9:00 AM), all market hours (10 AM - 3 PM), post-market close (4:00 PM), and evening filings (5:00 PM)
    - cron: '30 3-11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime
  repository_dispatch: # Allows remote API webhook triggers
    types: [start-gathering, refresh-news]

jobs:
  sync-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated news and price files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Cloud News & Market Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python backend/scripts/run_cloud_news_worker.py

      - name: Commit and Push Updated News & Prices
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated hourly sync: latest news clusters and market prices [skip ci]"
          file_pattern: "backend/data/news/* backend/data/prices/*"
